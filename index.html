<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <style>
    :root {
      --bg: #ffffff; --text: #1a1a2e; --muted: #5b6078;
      --accent: #4f46e5; --card: #f5f6fb; --border: #e2e4ee;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1020; --text: #e8e9f3; --muted: #9a9fb8;
              --accent: #818cf8; --card: #181a2e; --border: #2a2d46; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background: var(--bg); color: var(--text); line-height: 1.6; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 0 20px; }
    header { padding: 80px 0 40px; }
    h1 { font-size: 2.6rem; margin: 0; }
    .title { color: var(--accent); font-size: 1.2rem; margin: 6px 0 16px; }
    .tagline { color: var(--muted); font-size: 1.05rem; max-width: 650px; }
    .links a, .contact a { margin-right: 16px; color: var(--accent); text-decoration: none; font-weight: 500; }
    .links a:hover, .contact a:hover { text-decoration: underline; }
    section { margin: 48px 0; }
    h2 { font-size: 1.4rem; border-bottom: 2px solid var(--accent);
         padding-bottom: 6px; display: inline-block; margin-bottom: 20px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .card h3 { margin: 0 0 8px; font-size: 1.1rem; }
    .card p { margin: 0 0 10px; color: var(--muted); }
    .tag { display: inline-block; font-size: 0.8rem; background: var(--bg); border: 1px solid var(--border);
           border-radius: 999px; padding: 2px 10px; margin: 2px 4px 2px 0; color: var(--muted); }
    .item { margin-bottom: 28px; }
    .item-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; }
    .item-head strong { font-size: 1.05rem; }
    .muted { color: var(--muted); }
    ul { padding-left: 20px; margin: 8px 0 0; }
    li { margin-bottom: 6px; }
    .skill-group { margin-bottom: 14px; }
    .skill-group h4 { margin: 0 0 6px; color: var(--muted); font-weight: 600; font-size: 0.95rem; }
    footer { text-align: center; color: var(--muted); padding: 40px 0; font-size: 0.9rem; border-top: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 id="name"></h1>
      <div class="title" id="title"></div>
      <p class="tagline" id="tagline"></p>
      <div class="links" id="links"></div>
      <div class="contact" id="contact"></div>
    </header>

    <section>
      <h2>About</h2>
      <p id="about"></p>
    </section>

    <section>
      <h2>Skills</h2>
      <div id="skills"></div>
    </section>

    <section>
      <h2>Experience</h2>
      <div id="experience"></div>
    </section>

    <section>
      <h2>Projects</h2>
      <div class="grid" id="projects"></div>
    </section>

    <section>
      <h2>Education</h2>
      <div id="education"></div>
    </section>

    <footer id="footer"></footer>
  </div>

  <script>
    // Helper: create an element with text (safe from HTML injection)
    function el(tag, text, className) {
      const e = document.createElement(tag);
      if (text !== undefined && text !== null) e.textContent = text;
      if (className) e.className = className;
      return e;
    }

    function link(href, label) {
      const a = el("a", label);
      a.href = href;
      a.target = "_blank";
      a.rel = "noopener";
      return a;
    }

    fetch("portfolio.json")
      .then(res => res.json())
      .then(data => render(data))
      .catch(err => {
        document.body.insertAdjacentHTML("afterbegin",
          "<p style='color:red;padding:20px'>Could not load portfolio.json</p>");
        console.error(err);
      });

    function render(d) {
      document.title = d.name + " | Portfolio";
      document.getElementById("name").textContent = d.name;
      document.getElementById("title").textContent = d.title;
      document.getElementById("tagline").textContent = d.tagline;
      document.getElementById("about").textContent = d.about;
      document.getElementById("footer").textContent =
        "© " + new Date().getFullYear() + " " + d.name;

      // Links
      const linksDiv = document.getElementById("links");
      const labels = { github: "GitHub", linkedin: "LinkedIn", resume: "Resume", website: "Website" };
      for (const key in d.links) {
        if (d.links[key] && labels[key]) linksDiv.appendChild(link(d.links[key], labels[key]));
      }

      // Contact
      const contact = document.getElementById("contact");
      if (d.email) contact.appendChild(link("mailto:" + d.email, d.email));
      if (d.phone) contact.appendChild(el("span", d.phone, "muted"));
      if (d.location) contact.appendChild(el("span", " · " + d.location, "muted"));

      // Skills
      const skills = document.getElementById("skills");
      for (const group in d.skills) {
        const g = el("div", null, "skill-group");
        g.appendChild(el("h4", group));
        d.skills[group].forEach(s => g.appendChild(el("span", s, "tag")));
        skills.appendChild(g);
      }

      // Experience
      const exp = document.getElementById("experience");
      d.experience.forEach(job => {
        const item = el("div", null, "item");
        const head = el("div", null, "item-head");
        head.appendChild(el("strong", job.role + " · " + job.company));
        head.appendChild(el("span", job.period, "muted"));
        item.appendChild(head);
        const ul = el("ul");
        job.points.forEach(p => ul.appendChild(el("li", p)));
        item.appendChild(ul);
        exp.appendChild(item);
      });

      // Projects
      const proj = document.getElementById("projects");
      d.projects.forEach(p => {
        const card = el("div", null, "card");
        card.appendChild(el("h3", p.name));
        card.appendChild(el("p", p.description));
        (p.tech || []).forEach(t => card.appendChild(el("span", t, "tag")));
        if (p.link) {
          const a = link(p.link, "View project →");
          a.style.display = "inline-block";
          a.style.marginTop = "10px";
          card.appendChild(a);
        }
        proj.appendChild(card);
      });

      // Education
      const edu = document.getElementById("education");
      d.education.forEach(e => {
        const item = el("div", null, "item");
        const head = el("div", null, "item-head");
        head.appendChild(el("strong", e.degree + " · " + e.school));
        head.appendChild(el("span", e.period, "muted"));
        item.appendChild(head);
        edu.appendChild(item);
      });
    }
  </script>
</body>
</html>
